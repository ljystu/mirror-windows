<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title> </title>
<link id="icon" rel="icon" href="data:,">
<style>
  /* White like most pages while the picture loads; neutral grey when there is no picture
     yet (new tab, chrome:// pages). */
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  .noshot, .noshot body { background: #3a3a3c; }
  /* The last view of the page (a newer one fades in over the older), laid out exactly like the page itself (same width, from the
     top), so when the real page takes its place nothing moves. */
  .shot { position: fixed; inset: 0; background-size: 100% auto; background-position: top left;
    background-repeat: no-repeat; transition: opacity 250ms ease-out; }
  /* Only while the page lives in the other window: a soft blur, slightly dimmed. A backdrop
     blur mirrors the screen edges, so they don't darken the way a plain blur does. */
  #veil { position: fixed; inset: 0; pointer-events: none; background: rgba(0, 0, 0, 0);
    backdrop-filter: blur(0px); transition: backdrop-filter 220ms ease-out, background-color 220ms ease-out; }
  .away #veil { backdrop-filter: blur(5px) saturate(0.95); background: rgba(0, 0, 0, 0.06); }
</style>
</head>
<body>
  <div id="shots"></div>
  <div id="veil"></div>
  <script src="placeholder.js"></script>
</body>
</html>
